name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Lint
        run: |
          brew install swiftlint swiftformat
          swiftformat --lint .
          swiftlint --strict
      - name: SPDX headers
        run: |
          missing=$(grep -rL 'SPDX-License-Identifier: LicenseRef-PolyForm-Perimeter-1.0.0' --include='*.swift' Sources Tests Package.swift || true)
          if [ -n "$missing" ]; then echo "missing SPDX header:"; echo "$missing"; exit 1; fi
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Bundle
        run: scripts/bundle.sh release && ls -R dist/JitPass.app
