# Release: build, Developer ID sign, notarize, staple, publish as a DRAFT,
# verify the PUBLISHED asset, then undraft. Mirrors jitpass/jit's release.yml
# in every rule that matters: never ship unsigned (the preflight refuses,
# rather than letting a missing secret skip signing), verify what GitHub
# actually serves rather than dist/, and only then make it visible.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Require Developer ID signing and notary secrets
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          PW: ${{ secrets.MACOS_SIGN_PASSWORD }}
          NK: ${{ secrets.MACOS_NOTARY_KEY }}
          NKID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NISS: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$P12" ] || [ -z "$PW" ]; then
            echo "::error::refusing to publish without Developer ID signing secrets"; exit 1
          fi
          if [ -z "$NK" ] || [ -z "$NKID" ] || [ -z "$NISS" ]; then
            echo "::error::refusing to publish without notary secrets"; exit 1
          fi

      - name: Import the signing identity into a temporary keychain
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          PW: ${{ secrets.MACOS_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpw=$(openssl rand -hex 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          rm -f "$RUNNER_TEMP/sign.p12"
          echo "SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, pack
        env:
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NK: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$NK" > "$RUNNER_TEMP/AuthKey.p8"
          export NOTARY_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          scripts/bundle.sh release
          scripts/sign.sh
          scripts/notarize.sh
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Publish as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "$GITHUB_REF_NAME" \
            dist/JitPass-*-arm64.zip dist/checksums.txt

      - name: Verify the published asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --pattern '*.zip' --pattern 'checksums.txt' --dir "$work" --clobber
          scripts/verify.sh "$work"/JitPass-*-arm64.zip "$work/checksums.txt"

      - name: Undraft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

      # The cask is pushed only AFTER the release is verified and visible, so
      # the tap can never point at a draft. Without the tap token this step
      # prints the cask for a manual push instead of failing the release.
      - name: Update the jit-app cask in jitpass/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          sha=$(cut -d' ' -f1 dist/checksums.txt)
          scripts/cask.sh "$version" "$sha" > Casks/jit-app.rb
          cat Casks/jit-app.rb
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN not set; push Casks/jit-app.rb to jitpass/homebrew-tap by hand"
            exit 0
          fi
          tap=$(mktemp -d)
          git clone -q "https://x-access-token:${TAP_TOKEN}@github.com/jitpass/homebrew-tap.git" "$tap"
          cp Casks/jit-app.rb "$tap/Casks/jit-app.rb"
          cd "$tap"
          git -c user.name="jitpass-release" -c user.email="release@jitpass.com" \
            commit -q -am "Brew cask update for jit-app version v$version"
          git push -q
