# Test build: the release pipeline's build, sign, notarize and verify, run
# on any branch by hand, with the result kept as a workflow artifact for a
# week. It NEVER publishes: no GitHub release, no cask, no tap push. It is
# how a change to what ships (the helper bundle, its entitlements) is tried
# on a real Mac before any release carries it.
#
# Run it on a branch (the workflow file must be on the default branch for
# workflow_dispatch to see it, and it then uses the dispatched branch's
# scripts):
#   gh workflow run test-build.yml --ref helper-entitlements
#   gh workflow run test-build.yml --ref helper-entitlements -f jit_ref=main
name: test-build
on:
  workflow_dispatch:
    inputs:
      jit_ref:
        description: "jitpass/jit ref to build jit from (empty = the release pinned in jit.version)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test-build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same refusal as release.yml, plus the helper's provisioning profile
      # when this branch's scripts use one (jit-app #53 onward): signing the
      # helper's entitlements without it would build a jit macOS kills at
      # launch.
      - name: Require Developer ID signing and notary secrets
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          PW: ${{ secrets.MACOS_SIGN_PASSWORD }}
          NK: ${{ secrets.MACOS_NOTARY_KEY }}
          NKID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NISS: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          AGENT: ${{ secrets.MACOS_AGENT_PROFILE }}
        run: |
          if [ -z "$P12" ] || [ -z "$PW" ]; then
            echo "::error::refusing to build without Developer ID signing secrets"; exit 1
          fi
          if [ -z "$NK" ] || [ -z "$NKID" ] || [ -z "$NISS" ]; then
            echo "::error::refusing to build without notary secrets"; exit 1
          fi
          if grep -q AGENT_PROFILE scripts/lib.sh scripts/sign.sh && [ -z "$AGENT" ]; then
            echo "::error::this branch signs the helper with a provisioning profile; MACOS_AGENT_PROFILE is not set"; exit 1
          fi

      - name: Import the signing identity into a temporary keychain
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          PW: ${{ secrets.MACOS_SIGN_PASSWORD }}
          AGENT: ${{ secrets.MACOS_AGENT_PROFILE }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpw=$(openssl rand -hex 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          rm -f "$RUNNER_TEMP/sign.p12"
          echo "SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          if [ -n "$AGENT" ]; then
            echo "$AGENT" | base64 --decode > "$RUNNER_TEMP/agent.provisionprofile"
            echo "AGENT_PROFILE=$RUNNER_TEMP/agent.provisionprofile" >> "$GITHUB_ENV"
          fi

      # The bundle's version: never one a release could have, so a test
      # build is never mistaken for one (lib.sh's version_from_env would
      # otherwise stamp the branch name). 0.0.<run> sorts below every
      # release, so an installed test build is offered the real one.
      - name: Stamp a test version
        run: |
          echo "VERSION=0.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          # An artifact name may not hold a slash; a branch name may.
          echo "ARTIFACT=JitPass-test-${{ github.run_number }}-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_ENV"

      # jit from source, when asked. Only a branch whose sign.sh re-signs the
      # bundled jit (the helper bundle, jit-app #52 onward) may do this: before
      # that, the bundled jit ships with the signature it came with, and a
      # source build has none.
      - name: Refuse a source-built jit this branch would ship unsigned
        if: inputs.jit_ref != ''
        run: |
          if ! grep -q 'HELPER' scripts/sign.sh; then
            echo "::error::this branch's sign.sh does not re-sign the bundled jit, so a jit built from source would ship unsigned; run with an empty jit_ref, or on a branch with the helper bundle"
            exit 1
          fi

      - name: Check out jitpass/jit
        if: inputs.jit_ref != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jitpass/jit
          ref: ${{ inputs.jit_ref }}
          path: jit-src

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: inputs.jit_ref != ''
        with:
          go-version-file: jit-src/go.mod
          cache-dependency-path: jit-src/go.sum

      # Built the way jit's goreleaser builds it (the version by ldflags, the
      # completions from the binary itself), and labelled <pinned>-dev.<sha>:
      # written into this checkout's jit.version, it becomes the bundle's
      # JitVersion and the staging directory fetch-jit.sh treats as already
      # fetched, and verify.sh's "the bundled jit reports the bundle's
      # JitVersion" check then holds honestly.
      - name: Build jit from source into the staging directory
        if: inputs.jit_ref != ''
        run: |
          set -euo pipefail
          sha=$(git -C jit-src rev-parse --short=7 HEAD)
          label="$(tr -d '[:space:]' < jit.version)-dev.$sha"
          printf '%s\n' "$label" > jit.version
          stage="dist/jit-$label"
          mkdir -p "$stage/completions"
          (cd jit-src && CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X github.com/jitpass/jit/internal/agent.version=$label" \
            -o "$GITHUB_WORKSPACE/$stage/jit" ./cmd/jit)
          "$stage/jit" completion zsh > "$stage/completions/_jit"
          "$stage/jit" completion bash > "$stage/completions/jit.bash"
          "$stage/jit" completion fish > "$stage/completions/jit.fish"
          "$stage/jit" --version
          echo "JIT_SOURCE=jitpass/jit@${{ inputs.jit_ref }} ($(git -C jit-src rev-parse HEAD)), labelled $label" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, pack
        env:
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NK: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$NK" > "$RUNNER_TEMP/AuthKey.p8"
          export NOTARY_KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          scripts/bundle.sh release
          scripts/sign.sh
          scripts/notarize.sh
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # The release gate's own verification, on the zip this run built.
      - name: Verify the build
        run: |
          set -euo pipefail
          scripts/verify.sh "dist/JitPass-${VERSION}-arm64.zip" dist/checksums.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/JitPass-${{ env.VERSION }}-arm64.zip
            dist/checksums.txt
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## JitPass test build ${VERSION}"
            echo
            echo "- **App:** \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`"
            echo "- **jit:** ${JIT_SOURCE:-the release pinned in jit.version ($(tr -d '[:space:]' < jit.version))}"
            echo "- **Verified:** ${{ job.status == 'success' && 'yes, scripts/verify.sh passed' || 'no, see the failed step' }}"
            echo "- **Published:** never. This build is only the artifact below, kept 7 days."
            echo
            echo "### Install it for testing"
            echo "1. Download the artifact \`${ARTIFACT}\` from this run and unzip it (it holds \`JitPass-${VERSION}-arm64.zip\`)."
            echo "2. Quit JitPass, unzip \`JitPass-${VERSION}-arm64.zip\`, and move \`JitPass.app\` into /Applications, replacing the installed one."
            echo "3. Open it. The next real release is offered as an update (a test build is 0.0.N)."
          } >> "$GITHUB_STEP_SUMMARY"
